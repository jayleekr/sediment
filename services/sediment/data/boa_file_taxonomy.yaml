golden_scenarios:
  - id: nas_orientation
    anchor_query: "보아 NAS에서 데스크 업무와 교정 업무 자료는 어떻게 나뉘어 있어?"
    expected_terms: ["데스크 업무", "교정", "보험", "스텝", "비급여"]
  - id: private_insurance
    anchor_query: "라이나 치아보험 청구할 때 필요한 서류와 데스크 확인사항을 정리해줘"
    expected_terms: ["라이나", "보험금 청구서", "치과치료 확인서", "개인정보 동의서"]
  - id: orthodontic_consent
    anchor_query: "교정 유지장치 제거 동의서가 필요한 상황과 환자 안내 포인트는?"
    expected_terms: ["유지장치", "동의서", "주의사항", "재제작"]
  - id: implant_workflow
    anchor_query: "임플란트 상담부터 수술 전까지 데스크가 챙겨야 할 문서는?"
    expected_terms: ["임플란트 준비표", "CT", "동의서", "수술 전 안내"]
  - id: noncovered_fee_reporting
    anchor_query: "2026 비급여 보고 제출자료 준비 체크리스트를 만들어줘"
    expected_terms: ["2026", "비급여", "보고월", "수가", "제출"]
  - id: desk_training
    anchor_query: "신입 데스크 직원에게 보험청구 실수 Top 5를 교육하려면 어떤 자료를 보면 돼?"
    expected_terms: ["신입", "데스크", "보험청구", "체크리스트", "실수"]

validation_thresholds:
  file_count_tolerance_pct: 2
  search_recall_at_3_min: 0.80
  search_recall_at_5_min: 0.90
  search_p95_ms_local_max: 700
  search_p95_ms_remote_max: 1200
  ask_retrieval_ms_max: 2000
  lecture_chunk_count_min: 1500
  lecture_chunk_count_max: 3000

harness_layers:
  - id: preflight
    command: "python3 services/sediment/scripts/boa_demo_harness.py --preflight"
    blocks_generation: true
    requires_network: false
  - id: generate
    command: "python3 services/sediment/scripts/generate_boa_synthetic_files.py --profile lecture_360"
    requires_network: false
  - id: validate_files
    command: "python3 services/sediment/scripts/validate_boa_synthetic_files.py --profile lecture_360"
    requires_network: false
  - id: convert_vault
    command: "python3 services/sediment/scripts/convert_boa_files_to_vault.py --profile lecture_360"
    requires_network: false
  - id: local_retrieval
    command: "python3 services/sediment/scripts/boa_local_retrieval_check.py --profile lecture_360"
    requires_network: false
  - id: performance
    command: "python3 services/sediment/scripts/boa_perf_check.py --profile lecture_360 --mode strict-local"
    requires_network: false
  - id: e2e_strict_local
    command: "python3 services/sediment/scripts/boa_e2e.py --profile lecture_360 --mode strict-local"
    requires_network: false
  - id: e2e_strict_online
    command: "python3 services/sediment/scripts/boa_demo_harness.py --profile lecture_360 --mode strict-online"
    required_for_live_studio_demo: true
    requires_network: true
