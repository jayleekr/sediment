version: 1
tenant_slug: boa-demo
target_profile:
  name: lecture_360
  total_files: 360
  target_chunks_min: 1500
  target_chunks_max: 3000
  purpose: "1-2 hour lecture corpus that looks like a Korean dental clinic NAS"

execution_policy:
  default_mode: strict-local
  non_interactive: true
  ask_permission_mid_run: false
  allow_fallback: false
  fail_fast_on_missing_dependency: true
  fail_fast_on_missing_required_format: true
  fail_fast_on_skipped_required_check: true
  remove_fallback_code_when_found: true
  require_network_default: false
  require_llm_for_strict_local: false
  require_embedding_for_strict_local: false
  require_embedding_for_strict_online: true
  allowed_write_roots:
    - "assets/generated/boa_nas"
    - "assets/generated/boa_vault_md"
    - "assets/generated/boa_reports"
  cleanup_policy: manifest_only
  subprocess_timeout_seconds: 120
  http_timeout_seconds: 20
  deterministic_seed: 20260525
  substitute_outputs_allowed: false
  forbidden_substitute_extensions:
    - ".docx.txt"
    - ".pdf.txt"
    - ".png.txt"
    - ".jpg.txt"

profiles:
  sample_60:
    total_files: 60
    purpose: "fast harness smoke test"
    target_chunks_min: 220
    target_chunks_max: 600
  lecture_360:
    total_files: 360
    purpose: "actual 1-2 hour lecture corpus"
    target_chunks_min: 1500
    target_chunks_max: 3000
  stress_1200:
    total_files: 1200
    purpose: "separate local performance expansion"
    target_chunks_min: 5000
    target_chunks_max: 10000
    required_for_lecture: false

global_rules:
  synthetic_only: true
  contains_real_phi: false
  language: ko
  root: "assets/generated/boa_nas"
  vault_root: "assets/generated/boa_vault_md"
  metadata_sidecar: true
  modification_date_range:
    start: "2021-01-01"
    end: "2026-05-25"
  filename_style:
    - "Korean clinic NAS style"
    - "year prefixes for annual reports and schedules"
    - "revision suffixes such as 수정, 최종, v2"
    - "mixed dental English terms such as MARPE, Mini screw, OHC, EMS"

file_type_mix:
  xlsx: 120
  docx: 95
  pdf: 95
  png_jpg: 30
  md_json: 20

