[project]
name = "ai-curator"
version = "0.1.0"
description = "AI Curator — HypeProof Lab internal product (multi-tenant SaaS-ready)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-frontmatter>=1.1",
  "anthropic>=0.42",
  "openai>=1.59",
  "langgraph>=0.2.62",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
  "httpx>=0.28",
  "redis>=5.2",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
  "rich>=13.9",
  "tenacity>=9.0",
  "tiktoken>=0.8",
  "fastmcp>=2.0",
  "PyYAML>=6.0",
  "playwright>=1.49",
  "google-genai>=1.0",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "ipython>=8.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lab_lib*", "lab_platform*", "applications*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put services/sediment (this rootdir) on sys.path so `from scripts.* import`
# / `from lab_lib.* import` resolve regardless of the invocation directory
# (POLISH-B: previously only worked via `cd services/sediment && python -m pytest`).
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
