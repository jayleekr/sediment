# Sediment — E2E Browser Spec (v0.2)
# Executed by validator/e2e_runner.py via Playwright (Python).
# Each flow is replayed `repeat` times within a single iteration to measure flake rate.
#
# v0.2 (2026-05-20): multi-environment. Select with SEDIMENT_E2E_ENV (default
# "dev"). Per-flow `environments:` tag opts a flow into other envs; flows
# without the tag default to ["dev"] only (backwards-compat with v0.1).
# Override base_url with SEDIMENT_E2E_BASE_URL for ad-hoc targets.

# Top-level defaults below are the deprecated v0.1 form, kept as a fallback
# for any caller that hasn't migrated to environments[env].
base_url: "http://localhost:3000"
default_timeout_ms: 20000  # sediment#20: 8000 was too tight under prod cold-start variance
viewport:
  width: 1280
  height: 900
seed_member:
  email: "jayleekr0125@gmail.com"

environments:
  dev:
    # Local Next dev server (`cd frontend && npm run dev`). Uses the
    # `Mint dev token` form which only exists in dev (member-by-email seed).
    base_url: "http://localhost:3000"
    auth_method: dev_token
    seed_member:
      email: "jayleekr0125@gmail.com"
  prod:
    # Live standalone Vercel deploy. Prod uses GitHub OAuth — there is no
    # automated sign-in here yet, so only auth_method=none flows run.
    base_url: "https://sediment.hypeproof-ai.xyz"
    auth_method: none
    seed_member: null

flows:

  - id: E2E-01
    name: "Sign-in flow"
    severity: blocker
    environments: [dev]
    repeat: 5
    pass_threshold: 4
    steps:
      - action: navigate
        url: "/sediment"
        wait_for: "input[placeholder='member email']"
        screenshot: "01-empty-form"
      - action: fill
        selector: "input[placeholder='member email']"
        value: "{{seed_member.email}}"
        screenshot: "02-filled"
      - action: click
        selector: "button:has-text('Mint dev token')"
        wait_for: "text=Conversations"
        screenshot: "03-after-signin"
      - action: assert
        type: localStorage_has
        key: "curator.token"
      - action: assert
        type: console_errors_max
        value: 0

  - id: E2E-02
    name: "Empty state visible"
    severity: minor
    environments: [dev]
    repeat: 2
    pass_threshold: 2
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "text=Try one"
        screenshot: "01-empty-state"
      - action: assert
        type: text_contains
        selector: "h2"
        value: "Ask"

  - id: E2E-03
    name: "New conversation + first query"
    severity: blocker
    environments: [dev]
    repeat: 5
    pass_threshold: 4
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "text=Try one"
        screenshot: "01-home"
      - action: click
        selector: "button:has-text('mirror-loop')"
        wait_for_url_regex: "/sediment/c/"
        screenshot: "02-conv-page"
      - action: assert
        type: url_contains
        value: "/sediment/c/"

  - id: E2E-04
    name: "Streaming UI"
    severity: blocker
    environments: [dev]
    repeat: 5
    pass_threshold: 3
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "input[placeholder*='ryan']"
      - action: fill
        selector: "input[placeholder*='ryan']"
        value: "Daily research 중 Claude Code 관련"
      - action: press_key
        key: "Enter"
        wait_for_url_regex: "/sediment/c/"
        screenshot: "01-streaming-start"
      - action: wait_for_text
        value: "thinking"
        timeout_ms: 10000
        optional: true
      - action: wait_for_selector
        selector: "div.animate-pulse, .whitespace-pre-wrap"
        timeout_ms: 10000
        screenshot: "02-streaming-mid"
      - action: wait_for_idle
        timeout_ms: 30000
        screenshot: "03-streaming-end"
      - action: assert
        type: console_errors_max
        value: 1

  - id: E2E-05
    name: "Citation cards visible"
    severity: major
    environments: [dev]
    repeat: 2
    pass_threshold: 1
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
      - action: click
        selector: "button:has-text('Daily research')"
        wait_for_url_regex: "/sediment/c/"
      - action: wait_for_idle
        timeout_ms: 30000
      - action: screenshot
        name: "01-after-stream"
      - action: assert
        type: selector_visible
        selector: "h3:has-text('Citations')"

  - id: E2E-06
    name: "Library browse + filter"
    severity: major
    environments: [dev]
    repeat: 2
    pass_threshold: 2
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment/library"
        wait_for: "th:has-text('ref')"
        screenshot: "01-library"
      - action: click
        selector: "button:has-text('column')"
        wait_for: "th:has-text('ref')"
        screenshot: "02-filtered"
      - action: assert
        type: console_errors_max
        value: 0

  - id: E2E-07
    name: "Members page"
    severity: minor
    environments: [dev]
    repeat: 2
    pass_threshold: 2
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment/members"
        wait_for: "text=Jay"
        screenshot: "01-members"
      - action: assert
        type: count_min
        selector: ".rounded-xl"
        min: 5

  - id: E2E-08
    name: "Cross-tenant negative test"
    severity: blocker
    environments: [dev]
    repeat: 3
    pass_threshold: 2
    steps:
      # Sign in as acme-test member, attempt to load lab's conversation URL
      - action: signout
      - action: signin_as
        email: "admin@acme.test"
      - action: navigate
        url: "/sediment"
        wait_for: "text=Conversations"
        screenshot: "01-acme-home"
      # Attempt to use a REAL lab conversation URL must result in 404 / empty.
      # WO-7 #6 2026-05-24: the prior hardcoded 00000000-...-deadbeef0000 UUID
      # didn't exist for any tenant, so the test passed whether RLS worked or
      # not — no signal on cross-tenant isolation. Now {{lab_conv_id}} is
      # resolved by e2e_runner from a live DB query (most-recent lab conv).
      - action: navigate
        url: "/sediment/c/{{lab_conv_id}}"
        wait_for_idle: true
        screenshot: "02-acme-cross-tenant"
      - action: assert_no
        type: text_contains
        value: "rls-check"
      - action: assert
        type: console_errors_max
        value: 2  # 401/404 are expected → may show in console

  - id: E2E-09
    name: "Multi-turn conversation"
    # Verifies a single conv_id supports sequential queries — second message
    # must stream + render alongside the first, with citations on both. Catches
    # the conv state regression that would happen if we ever lost the inputbox
    # reactivation on stream.done = true.
    severity: major
    environments: [dev]
    repeat: 2
    pass_threshold: 2
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "text=Try one"
      - action: click
        selector: "button:has-text('Daily research')"
        wait_for_url_regex: "/sediment/c/"
        screenshot: "01-first-turn-start"
      - action: wait_for_idle
        timeout_ms: 30000
        screenshot: "02-first-turn-done"
      # Second turn — reuse the same conv. The input is re-enabled only when
      # stream.done is true (see web/src/app/sediment/c/[id]/page.tsx).
      - action: fill
        selector: "input[placeholder='ask the lab…']"
        value: "그것과 관련된 칼럼은?"
      - action: click
        selector: "button:has-text('Send')"
        screenshot: "03-second-turn-sent"
      # 2nd-turn stream completion: wait for a citation reference to appear
      # in the answer (the system prompt requires [N] inline refs). This is a
      # stronger signal than wait_for_idle, which can fire during the brief
      # gap between SSE chunks.
      - action: wait_for_text
        value: "[1]"
        timeout_ms: 60000
      - action: wait_for_idle
        timeout_ms: 60000
        screenshot: "04-second-turn-done"
      # Both assistant bubbles must be present after second turn finishes.
      - action: assert
        type: count_min
        selector: "[data-role='assistant']"
        min: 2
      # Both user turns must have been recorded.
      - action: assert
        type: count_min
        selector: "[data-role='user']"
        min: 2
      # The second turn must have actually answered — "thinking…" sentinel
      # would mean the second SSE stream never produced delta events.
      # We check the body (broader than :last-child which can match an inner
      # element). 'thinking…' uses ELLIPSIS char (U+2026).
      - action: assert_no
        type: text_contains
        selector: "[data-role='assistant']:nth-of-type(2)"
        value: "thinking…"

  - id: E2E-10
    name: "Mobile viewport (iPhone 12)"
    # Verifies the curator UI renders without horizontal overflow at 390x844
    # and the sign-in form is usable. Catches Tailwind grid-cols-12 regressions
    # that would push the conv pane off-screen on narrow viewports.
    severity: major
    environments: [dev]
    repeat: 2
    pass_threshold: 2
    viewport:
      width: 390
      height: 844
    steps:
      - action: navigate
        url: "/sediment"
        wait_for: "input[placeholder='member email']"
        screenshot: "01-signin-mobile"
      - action: fill
        selector: "input[placeholder='member email']"
        value: "{{seed_member.email}}"
      - action: click
        selector: "button:has-text('Mint dev token')"
        wait_for: "text=Try one"
        screenshot: "02-home-mobile"
      # No horizontal scrollbar — page must fit viewport width
      - action: assert
        type: console_errors_max
        value: 1
      # The Ask form is always present on the home page after sign-in,
      # regardless of whether the user has prior conversations.
      - action: assert
        type: selector_visible
        selector: "[data-testid='ask-input']"
      - action: assert
        type: selector_visible
        selector: "button:has-text('Ask')"

  - id: E2E-11
    name: "Sign out clears token"
    # Bare-bones smoke flow that pairs with the concurrent-SSE platform check.
    # Yes, signout isn't a feature flag for users — but if localStorage.clear
    # were ever bypassed by a stale ref, multi-turn would leak across tenants.
    severity: minor
    environments: [dev]
    repeat: 2
    pass_threshold: 2
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "text=Try one"
        screenshot: "01-signed-in"
      - action: signout
      - action: navigate
        url: "/sediment"
        wait_for: "input[placeholder='member email']"
        screenshot: "02-after-signout"
      - action: assert
        type: selector_visible
        selector: "input[placeholder='member email']"

  - id: E2E-12
    name: "Prod smoke — public routes + brand + console errors"
    # No-auth smoke against the live deploy. Walks every top-level public
    # route, asserts the Sediment brand renders, and asserts zero console
    # errors during the walk. Pairs with the curl-level /healthz + CORS
    # preflight in the validator suite to give a fast post-deploy signal
    # without needing OAuth credentials. Auth-gated routes (/library,
    # /members, /admin) load their public shell — that's enough to catch
    # SSR/bundle regressions even though the data calls 401.
    severity: blocker
    environments: [prod]
    # sediment#20: was repeat=2 pass_threshold=2 (strict 2/2) at 8s timeout.
    # Vercel edge cold-starts and Fly fresh-VM warmup caused frequent false
    # fails. Median-of-3 keeps the regression signal without crying wolf.
    repeat: 3
    pass_threshold: 2
    steps:
      - action: navigate
        url: "/sediment"
        wait_for: "h1:has-text('Sediment')"
        screenshot: "01-landing"
      - action: assert
        type: selector_visible
        selector: "h1:has-text('Sediment')"
      # The env badge must read 'prod' on this URL — proves the deploy
      # picked up the right NEXT_PUBLIC_* vars and isn't lying about its env.
      - action: assert
        type: text_contains
        selector: "[data-testid='sediment-env-badge']"
        value: "prod"
      - action: navigate
        url: "/sediment/library"
        wait_for_idle: true
        screenshot: "02-library"
      - action: navigate
        url: "/sediment/members"
        wait_for_idle: true
        screenshot: "03-members"
      - action: navigate
        url: "/sediment/onboard"
        wait_for_idle: true
        screenshot: "04-onboard"
      - action: navigate
        url: "/sediment/admin"
        wait_for_idle: true
        screenshot: "05-admin"
      - action: navigate
        url: "/sediment/pricing"
        wait_for_idle: true
        screenshot: "06-pricing"
      # Most routes fetch protected data on mount; without an auth session
      # those calls 401 and Chromium surfaces the failed-load as a console
      # error. That's expected, not a regression. Budget is calibrated from
      # 2026-05-20 measurement (3 × 401 on a 6-route walk); leave headroom
      # for ~1 extra per route, fail above that — a real JS exception or
      # bundle-load error would push well past this.
      - action: assert
        type: console_errors_max
        value: 8

  - id: E2E-13
    name: "kids-edu tenant — chat returns a citation"
    # Proves multi-tenant ingest works end-to-end: signin_as a kids-edu admin,
    # submit a chat query that should land citations on the
    # JinyongShin/hypeproof_kids_edu vault (specifically the AI Native 7
    # mindsets concept), and assert that AT LEAST ONE citation reference
    # renders in the answer. The reference selector is the same one already
    # tested in E2E-09 ([1] / [2] / [3] inline refs from the chat prompt).
    #
    # Why this is the proof: validates the whole pipeline — github_repo_fetch
    # → events → vault_ingester → chunks (with embeddings) → /v1/chat → SSE
    # → citation render. If any link breaks, the assertion fails.
    #
    # Tagged [prod] because kids-edu data only exists in the Supabase prod
    # DB — dev would need its own GitHub-Repo-Connector run to be testable.
    severity: major
    environments: [prod]
    repeat: 2
    pass_threshold: 2
    steps:
      - action: signout
      - action: signin_as
        email: "jayleekr0125@gmail.com"
      - action: navigate
        url: "/sediment"
        wait_for: "text=Try one"
        screenshot: "01-kids-edu-home"
      - action: fill
        selector: "input[placeholder='ask the lab…']"
        value: "AI Native 마인드 7종 설명해줘"
      - action: click
        selector: "button:has-text('Send')"
        wait_for_url_regex: "/sediment/c/"
        screenshot: "02-chat-sent"
      - action: wait_for_idle
        timeout_ms: 45000
        screenshot: "03-chat-done"
      # Any of [1], [2], [3], [4], [5] is sufficient — system prompt mandates
      # at least one inline citation when chunks are present. Absence = either
      # no retrieval or no chunks ingested = end-to-end regression.
      - action: assert
        type: text_matches_regex
        value: "\\[[1-5]\\]"

  - id: E2E-14
    name: "No-evidence chat fails closed"
    severity: major
    environments: [dev]
    repeat: 2
    pass_threshold: 1
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "input[placeholder='ask the lab…']"
      - action: fill
        selector: "input[placeholder='ask the lab…']"
        value: "zzzxqv no matching vault evidence 917263"
      - action: click
        selector: "button:has-text('Send')"
        wait_for_url_regex: "/sediment/c/"
      - action: wait_for_idle
        timeout_ms: 45000
        screenshot: "01-no-evidence-done"
      - action: assert
        type: text_matches_regex
        value: "(couldn't find evidence|citation validation failed|근거를 찾지 못했습니다|인용 검증)"

  - id: E2E-15
    name: "Reliability freshness answer carries citation"
    severity: major
    environments: [dev]
    repeat: 2
    pass_threshold: 1
    steps:
      - action: ensure_signed_in
      - action: navigate
        url: "/sediment"
        wait_for: "input[placeholder='ask the lab…']"
      - action: fill
        selector: "input[placeholder='ask the lab…']"
        value: "가장 최신 daily research가 언제꺼야?"
      - action: click
        selector: "button:has-text('Send')"
        wait_for_url_regex: "/sediment/c/"
      - action: wait_for_text
        value: "[1]"
        timeout_ms: 60000
      - action: wait_for_idle
        timeout_ms: 60000
        screenshot: "01-freshness-cited"
      - action: assert
        type: text_matches_regex
        value: "\\[[1-5]\\]"
      - action: assert
        type: selector_visible
        selector: "h3:has-text('Citations')"
