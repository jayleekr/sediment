# Sediment — Validation Rubric (v0.1)
# Declarative checks executed by validator/runner.py
#
# Check types:
#   bash    — shell command, expected_exit + (optional) stdout_contains/regex
#   sql     — SQL query, expected_rows / expected_value / expected_min_rows
#   http    — HTTP request, expected_status + (optional) json_path checks
#   python  — Python function, module + function name (returns CheckResult)
#   e2e     — Playwright flow id from e2e_spec.yaml
#
# Severity:
#   blocker — any single failure → exit 1 (release block)
#   major   — failure → score -3
#   minor   — failure → score -1

phases:

  # ════════════════════════════════════════════════════════════════
  # PHASE 0 — Scaffolding
  # ════════════════════════════════════════════════════════════════
  - id: P0
    name: "Scaffolding (infra + DDL + RLS)"
    description: "docker-compose up, init.sql applies cleanly, RLS policies active, decisions documented"
    pass_criteria:
      blockers_passed_pct: 100
      total_score_pct: 90
      layer_min_pct: 80

    checks:

      # ── INFRA (L1) ──────────────────────────────────────────
      - id: P0-INFRA-01
        title: "Postgres reachable on :5433"
        layer: L1
        severity: blocker
        type: bash
        cmd: "docker exec curator-pg pg_isready -U curator -d curator"
        expected_exit: 0

      - id: P0-INFRA-02
        title: "Redis reachable on :6380"
        layer: L1
        severity: blocker
        type: bash
        cmd: "docker exec curator-redis redis-cli ping"
        expected_stdout_contains: "PONG"

      - id: P0-INFRA-03
        title: "pgvector extension installed"
        layer: L1
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM pg_extension WHERE extname='vector'"
        expected_rows: 1
        role: service

      - id: P0-INFRA-04
        title: "uuid-ossp extension installed"
        layer: L1
        severity: minor
        type: sql
        sql: "SELECT 1 FROM pg_extension WHERE extname='uuid-ossp'"
        expected_rows: 1
        role: service

      - id: P0-INFRA-05
        title: "pg_trgm extension installed"
        layer: L1
        severity: minor
        type: sql
        sql: "SELECT 1 FROM pg_extension WHERE extname='pg_trgm'"
        expected_rows: 1
        role: service

      # ── DDL (L1) ────────────────────────────────────────────
      - id: P0-DDL-01
        title: "All 14 tenant-scoped tables exist"
        layer: L1
        severity: blocker
        type: python
        module: validator.checks.p0_scaffolding
        function: check_all_tables_exist

      - id: P0-DDL-02
        title: "chunks.embedding column is vector(1536)"
        layer: L1
        severity: blocker
        type: sql
        sql: |
          SELECT 1 FROM information_schema.columns
          WHERE table_name='chunks' AND column_name='embedding'
            AND udt_name='vector'
        expected_rows: 1
        role: service

      - id: P0-DDL-03
        title: "chunks.tsv tsvector column exists"
        layer: L1
        severity: blocker
        type: sql
        sql: |
          SELECT 1 FROM information_schema.columns
          WHERE table_name='chunks' AND column_name='tsv' AND udt_name='tsvector'
        expected_rows: 1
        role: service

      - id: P0-DDL-04
        title: "HNSW index on chunks.embedding"
        layer: L1
        severity: major
        type: sql
        sql: |
          SELECT 1 FROM pg_indexes
          WHERE tablename='chunks' AND indexdef ILIKE '%hnsw%'
        expected_min_rows: 1
        role: service

      # ── RLS (L3) ────────────────────────────────────────────
      - id: P0-RLS-01
        title: "RLS enabled on all tenant-scoped tables"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.p0_scaffolding
        function: check_rls_enabled_all

      - id: P0-RLS-02
        title: "FORCE ROW LEVEL SECURITY on all tenant-scoped tables"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.p0_scaffolding
        function: check_force_rls_all

      - id: P0-RLS-03
        title: "tenant_isolation policy exists per table (>= 13 policies)"
        layer: L3
        severity: blocker
        type: sql
        sql: |
          SELECT count(*) FROM pg_policies
          WHERE policyname='tenant_isolation' AND schemaname='public'
        # 2026-05-24: was hard-equal 13. Migrations 001 + 002 added new
        # tenant tables (cli_users, query_events, etc.) with their own
        # tenant_isolation policy → count is 16 now. Use a floor instead
        # of an exact match so future migrations don't bounce the check.
        expected_min_value: 13
        role: service

      - id: P0-RLS-04
        title: "tenant_self policy on tenants table"
        layer: L3
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='tenants' AND policyname='tenant_self'"
        expected_rows: 1
        role: service

      - id: P0-RLS-05
        title: "curator_app role exists"
        layer: L3
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM pg_roles WHERE rolname='curator_app'"
        expected_rows: 1
        role: service

      - id: P0-RLS-06
        title: "curator_service role exists"
        layer: L3
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM pg_roles WHERE rolname='curator_service'"
        expected_rows: 1
        role: service

      - id: P0-RLS-07
        title: "curator_service has BYPASSRLS"
        layer: L3
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM pg_roles WHERE rolname='curator_service' AND rolbypassrls=true"
        expected_rows: 1
        role: service

      - id: P0-RLS-08
        title: "current_tenant_id() function exists"
        layer: L3
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM pg_proc WHERE proname='current_tenant_id'"
        expected_rows: 1
        role: service

      # ── Decisions / META ────────────────────────────────────
      - id: P0-META-01
        title: "DECISIONS.md exists with 20 numbered answers"
        layer: L1
        severity: major
        type: python
        module: validator.checks.p0_scaffolding
        function: check_decisions_md_complete

      - id: P0-META-02
        title: ".env.example contains all required env vars"
        layer: L1
        severity: major
        type: python
        module: validator.checks.p0_scaffolding
        function: check_env_example_complete

      - id: P0-META-03
        title: "Makefile defines all 9 essential targets"
        layer: L1
        severity: major
        type: python
        module: validator.checks.p0_scaffolding
        function: check_makefile_targets

      - id: P0-META-04
        title: "SPEC.md + README.md exist + non-empty"
        layer: L1
        severity: minor
        type: bash
        cmd: "test -s SPEC.md && test -s README.md"
        expected_exit: 0


  # ════════════════════════════════════════════════════════════════
  # PHASE 1 — Read-only Index
  # ════════════════════════════════════════════════════════════════
  - id: P1
    name: "Read-only index (ingest + search + golden RAG)"
    description: "vault-ingester ingests repo, hybrid search returns relevant top-k, RLS leak = 0, golden 40 queries recall@3 ≥ 80%"
    pass_criteria:
      blockers_passed_pct: 100
      total_score_pct: 90
      layer_min_pct: 80

    checks:

      # ── SEED ────────────────────────────────────────────────
      - id: P1-SEED-01
        title: "hypeproof-lab tenant exists"
        layer: L1
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM tenants WHERE slug='hypeproof-lab'"
        expected_rows: 1
        role: service

      - id: P1-SEED-02
        title: "acme-test tenant exists (RLS regression target)"
        layer: L3
        severity: blocker
        type: sql
        sql: "SELECT 1 FROM tenants WHERE slug='acme-test'"
        expected_rows: 1
        role: service

      - id: P1-SEED-03
        title: "8 members seeded for hypeproof-lab"
        layer: L1
        severity: blocker
        type: sql
        sql: |
          SELECT count(*) FROM members m JOIN tenants t ON t.id = m.tenant_id
          WHERE t.slug='hypeproof-lab'
        expected_min_value: 7
        role: service

      - id: P1-SEED-04
        title: "Subscription row exists for hypeproof-lab"
        layer: L1
        severity: blocker
        type: sql
        sql: |
          SELECT 1 FROM subscriptions s JOIN tenants t ON t.id = s.tenant_id
          WHERE t.slug='hypeproof-lab'
        expected_rows: 1
        role: service

      - id: P1-SEED-05
        title: "Jay member is admin"
        layer: L1
        severity: minor
        type: sql
        sql: |
          SELECT 1 FROM members m JOIN tenants t ON t.id = m.tenant_id
          WHERE t.slug='hypeproof-lab' AND m.email='jayleekr0125@gmail.com' AND m.role='admin'
        expected_rows: 1
        role: service

      # ── INGEST ──────────────────────────────────────────────
      - id: P1-INGEST-01
        title: "vault-ingester /healthz returns 200"
        layer: L2
        severity: blocker
        type: http
        method: GET
        url: "http://localhost:11000/healthz"
        expected_status: 200

      - id: P1-INGEST-02
        title: "metadata-svc /healthz returns 200"
        layer: L2
        severity: major
        type: http
        method: GET
        url: "http://localhost:12000/healthz"
        expected_status: 200

      - id: P1-INGEST-03
        title: "Ingest single document → artifact persists"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p1_index
        function: check_ingest_single_doc

      - id: P1-INGEST-04
        title: "Re-ingest same ref is idempotent (no duplicate chunks)"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_ingest_idempotent

      - id: P1-INGEST-05
        title: "Embeddings have correct dim (1536)"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_embedding_dim

      - id: P1-INGEST-06
        title: "Repo corpus ingested ≥ 30 artifacts"
        layer: L2
        severity: major
        type: sql
        sql: "SELECT count(*) FROM artifacts WHERE tenant_id IN (SELECT id FROM tenants WHERE slug='hypeproof-lab')"
        expected_min_value: 30
        role: service

      - id: P1-INGEST-07
        title: "Repo corpus chunks ≥ 100"
        layer: L2
        severity: major
        type: sql
        sql: "SELECT count(*) FROM chunks WHERE tenant_id IN (SELECT id FROM tenants WHERE slug='hypeproof-lab')"
        expected_min_value: 100
        role: service

      # ── CHUNKER ─────────────────────────────────────────────
      - id: P1-CHUNK-01
        title: "Heading-aware split produces multiple chunks for multi-heading doc"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p1_index
        function: check_chunker_heading_split

      - id: P1-CHUNK-02
        title: "Overlap applied between consecutive chunks"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p1_index
        function: check_chunker_overlap

      - id: P1-CHUNK-03
        title: "Avg chunk size in 500-1500 token range"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p1_index
        function: check_chunker_avg_size

      # ── SEARCH ──────────────────────────────────────────────
      - id: P1-SEARCH-01
        title: "BM25 search returns relevant chunk (literal token match)"
        layer: L4
        severity: blocker
        type: python
        module: validator.checks.p1_index
        function: check_bm25_works

      - id: P1-SEARCH-02
        title: "Vector search returns chunk for semantic query"
        layer: L4
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_vector_search_works

      - id: P1-SEARCH-03
        title: "Hybrid (RRF) returns valid result"
        layer: L4
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_hybrid_search_works

      - id: P1-SEARCH-04
        title: "Library /search HTTP endpoint responds"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_library_search_http

      # ── RLS regression (★) ──────────────────────────────────
      - id: P1-RLS-01
        title: "Cross-tenant artifact leak = 0 (lab cannot see acme)"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.lib_rls
        function: check_cross_tenant_artifacts

      - id: P1-RLS-02
        title: "Cross-tenant chunk leak = 0"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.lib_rls
        function: check_cross_tenant_chunks

      - id: P1-RLS-03
        title: "Missing tenant_id → app role sees 0 rows (fail-safe)"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.lib_rls
        function: check_no_tenant_yields_empty

      - id: P1-RLS-04
        title: "service role can see both tenants (BYPASSRLS works)"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.lib_rls
        function: check_service_bypass_rls

      - id: P1-RLS-05
        title: "RLS active on all 13 tables (regression check)"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.p0_scaffolding
        function: check_rls_enabled_all

      # ── GOLDEN RAG (eval, expensive) ────────────────────────
      - id: P1-GOLDEN-RAG-01
        title: "Golden 40 queries: recall@3 ≥ 80%"
        layer: L4
        severity: major
        type: python
        module: validator.checks.lib_rag
        function: check_recall_at_k
        params: {k: 3, min_pct: 80}

      - id: P1-GOLDEN-RAG-02
        title: "Golden 40 queries: MRR ≥ 0.50"
        layer: L4
        severity: major
        type: python
        module: validator.checks.lib_rag
        function: check_mrr
        params: {min_mrr: 0.50}

      - id: P1-GOLDEN-RAG-03
        title: "Golden queries: median latency ≤ 1.0s"
        layer: L8
        severity: minor
        type: python
        module: validator.checks.lib_rag
        function: check_search_latency
        params: {max_p50_ms: 1000}

      - id: P1-FRESH-01
        title: "Vault freshness telemetry exposes capture/index/distill axes"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_freshness_telemetry_contract

      - id: P1-FRESH-02
        title: "Vault freshness flags artifact/chunk mismatch"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p1_index
        function: check_artifact_chunk_freshness_mismatch_contract


  # ════════════════════════════════════════════════════════════════
  # PHASE 2 — Chat MVP
  # ════════════════════════════════════════════════════════════════
  - id: P2
    name: "Chat MVP (SSE + intent + RLS + E2E)"
    description: "platform + langgraph reachable, JWT round-trip, SSE protocol, intent routing, web routes 200, E2E browser flows pass"
    pass_criteria:
      blockers_passed_pct: 100
      total_score_pct: 90
      layer_min_pct: 80

    checks:

      # ── Service health ──────────────────────────────────────
      - id: P2-HEALTH-01
        title: "sediment-platform :10100 healthy"
        layer: L2
        severity: blocker
        type: http
        method: GET
        url: "http://localhost:10100/healthz"
        expected_status: 200

      - id: P2-HEALTH-02
        title: "sediment-langgraph :10020 healthy"
        layer: L2
        severity: blocker
        type: http
        method: GET
        url: "http://localhost:10020/healthz"
        expected_status: 200

      - id: P2-HEALTH-03
        title: "vault-ingester :11000 healthy (Phase 1 still up)"
        layer: L2
        severity: blocker
        type: http
        method: GET
        url: "http://localhost:11000/healthz"
        expected_status: 200

      - id: P2-HEALTH-04
        title: "metadata-svc :12000 healthy"
        layer: L2
        severity: blocker
        type: http
        method: GET
        url: "http://localhost:12000/healthz"
        expected_status: 200

      - id: P2-HEALTH-05
        title: "Next.js dev server :3000 reachable"
        layer: L2
        severity: major
        type: http
        method: GET
        url: "http://localhost:3000/sediment"
        expected_status: 200

      # ── Auth ────────────────────────────────────────────────
      - id: P2-AUTH-01
        title: "POST /api/v1/auth/dev-token mints JWT for seeded member"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_dev_token_mints

      - id: P2-AUTH-02
        title: "JWT decode roundtrip preserves member_id + tenant_id"
        layer: L1
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_jwt_roundtrip

      - id: P2-AUTH-03
        title: "Bad email returns 404"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p2_chat
        function: check_dev_token_unknown_email

      - id: P2-AUTH-04
        title: "Tampered JWT rejected with 401"
        layer: L6
        severity: major
        type: python
        module: validator.checks.p2_chat
        function: check_tampered_jwt_rejected

      # ── Conversations CRUD ──────────────────────────────────
      - id: P2-CONV-01
        title: "POST /conversations creates row"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_create_conversation

      - id: P2-CONV-02
        title: "GET /conversations lists own"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_list_conversations

      - id: P2-CONV-03
        title: "POST message persists to DB"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_post_message

      - id: P2-CONV-04
        title: "GET /conversations/{id} returns messages"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p2_chat
        function: check_get_conversation_with_messages

      - id: P2-CONV-05
        title: "DELETE /conversations/{id} works"
        layer: L2
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_delete_conversation

      # ── SSE protocol ────────────────────────────────────────
      - id: P2-SSE-01
        title: "POST /v1/sediment/stream returns SSE response"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_sse_starts

      - id: P2-SSE-02
        title: "SSE emits event: message with status tag"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_sse_status_event

      - id: P2-SSE-03
        title: "SSE emits at least one event: delta"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_sse_delta_event

      - id: P2-SSE-04
        title: "SSE emits final [DONE]"
        layer: L2
        severity: blocker
        type: python
        module: validator.checks.p2_chat
        function: check_sse_done_terminator

      - id: P2-SSE-05
        title: "SSE emits event: citation when citations exist"
        layer: L2
        severity: major
        type: python
        module: validator.checks.p2_chat
        function: check_sse_citation_event

      - id: P2-SSE-06
