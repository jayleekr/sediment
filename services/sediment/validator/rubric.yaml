        severity: major
        type: python
        module: validator.checks.p2_chat
        function: check_assistant_msg_persisted

      - id: P2-SSE-07
        title: "TTFT (time to first token) ≤ 4.0s"
        layer: L8
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_ttft

