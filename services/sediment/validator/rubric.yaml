      # ── Intent routing ──────────────────────────────────────
      - id: P2-INTENT-01
        title: "Member-related question routed to 'member'"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_intent_member

      - id: P2-INTENT-02
        title: "Library question routed to 'library'"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_intent_library

      - id: P2-INTENT-03
        title: "Meta count question routed to 'meta'"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_intent_meta

      - id: P2-INTENT-04
        title: "Decision question routed to 'decision' (or library fallback)"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_intent_decision

      # ── MCP server ──────────────────────────────────────────
      - id: P2-MCP-01
        title: "Workspace MCP module imports without error"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_mcp_imports

      - id: P2-MCP-02
        title: "Workspace MCP defines 12 tools"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_mcp_tool_count

      - id: P2-MCP-03
        title: "MCP vault_search() returns rows for known query"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_mcp_vault_search

      - id: P2-MCP-04
        title: "MCP members_lookup() finds Jay"
        layer: L1
        severity: minor
        type: python
        module: validator.checks.p2_chat
        function: check_mcp_members_lookup

      # ── Web routes ──────────────────────────────────────────
      - id: P2-WEB-01
        title: "/sediment/library returns 200"
        layer: L2
        severity: major
        type: http
        method: GET
        url: "http://localhost:3000/sediment/library"
        expected_status: 200

      - id: P2-WEB-02
        title: "/sediment/members returns 200"
        layer: L2
        severity: major
        type: http
        method: GET
        url: "http://localhost:3000/sediment/members"
        expected_status: 200

      - id: P2-WEB-03
        title: "/sediment/admin returns 200"
        layer: L2
        severity: minor
        type: http
        method: GET
        url: "http://localhost:3000/sediment/admin"
        expected_status: 200

      - id: P2-WEB-04
        title: "/sediment/onboard returns 200 (stub)"
        layer: L2
        severity: minor
        type: http
        method: GET
        url: "http://localhost:3000/sediment/onboard"
        expected_status: 200

      - id: P2-WEB-05
        title: "/sediment/pricing returns 200 (stub)"
        layer: L2
        severity: minor
        type: http
        method: GET
        url: "http://localhost:3000/sediment/pricing"
        expected_status: 200

      # ── RLS during chat (★) ─────────────────────────────────
      - id: P2-RLS-01
        title: "Conversation belongs to creator's tenant"
        layer: L3
        severity: blocker
        type: python
        module: validator.checks.lib_rls
