[package]
name = "sediment"
version = "0.1.8"
edition = "2021"
description = "Sediment CLI — evidence-grounded memory, on the command line"
license = "Apache-2.0"
repository = "https://github.com/hypeprooflab/sediment"
rust-version = "1.75"

[[bin]]
name = "sediment"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
tempfile = "3"
url = "2"
futures-util = "0.3"
bytes = "1"
thiserror = "1"
# 2026-05-23 FIX-D: extract release tarballs in-process so we can validate
# each entry's path for traversal (../, absolute) BEFORE writing. Replaces
# the prior `tar -xzf` shell-out (CRIT #8) which also had shell-out PATH
# hijack and BSD-vs-GNU portability concerns. flate2 + tar = ~250KB combined.
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
