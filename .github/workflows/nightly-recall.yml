# Nightly recall@3 sweep against live prod.
#
# Why this exists: deploy + smoke (fly-deploy.yml) tells you the surface
# is up. This tells you the retrieval QUALITY hasn't drifted. RAG quality
# can degrade silently when chunking, embedding, or index params change.
#
# Auth: /dev-token is gated off in prod (SEDIMENT_DEV_MODE), so recall_live
# uses the SEDIMENT_CI_TOKEN secret as the bearer token (set it in repo
# secrets). Threshold is intentionally generous (≥20/40) so genuine breakage
# trips the alarm, normal noise doesn't.
#
# If quality drops below threshold, the job fails — workflow_dispatch a
# re-run after fixing, or open an issue tracking the regression.

name: Nightly recall

on:
  schedule:
    # 18:30 UTC = 03:30 KST (after the 21:15 consolidate cron has run +
    # before morning traffic). Cron uses UTC.
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-recall
  cancel-in-progress: false

jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps
        run: pip install --quiet pyyaml httpx
      - name: Verify SEDIMENT_CI_TOKEN secret is set
        env:
          SEDIMENT_CI_TOKEN: ${{ secrets.SEDIMENT_CI_TOKEN }}
        run: |
          if [ -z "$SEDIMENT_CI_TOKEN" ]; then
            echo "::error::SEDIMENT_CI_TOKEN secret is not set. Add it in repo settings — "\
                 "recall_live.py needs it because /api/v1/auth/dev-token 403s in prod."
            exit 1
          fi
      - name: Run recall@3
        working-directory: services/sediment
        env:
          SEDIMENT_API: https://hypeproof-sediment.fly.dev
          SEDIMENT_CI_TOKEN: ${{ secrets.SEDIMENT_CI_TOKEN }}
          SEDIMENT_EMAIL: jayleekr0125@gmail.com
          RECALL_MIN_PASS: "20"
          RECALL_JSON_OUT: ${{ github.workspace }}/recall.json
          VALIDATOR_OUTPUT_DIR: ${{ github.workspace }}/services/sediment/output/validation
        run: python -m validator.scripts.recall_live
      - name: Upload recall JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-recall-${{ github.run_id }}
          path: |
            recall.json
            services/sediment/output/validation/history/recall_at_3_prod.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Notify on regression
        if: failure()
        env:
          DISCORD_WEBHOOK_SEDIMENT: ${{ secrets.DISCORD_WEBHOOK_SEDIMENT }}
          # GH-evaluated value lifted to env BEFORE bash; passed by name below.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install --quiet jinja2
          # Try to read the JSON summary if it was written; otherwise just
          # fire a minimal payload pointing at the run.
          AUTH=False
          if [ -f recall.json ]; then
            PREV=$(python -c "import json; d=json.load(open('recall.json')); print(d.get('threshold',20))")
            CURR=$(python -c "import json; d=json.load(open('recall.json')); print(d.get('pass_n',0))")
            AUTH=$(python -c "import json; d=json.load(open('recall.json')); print(d.get('auth_error',False))")
          else
            PREV=20; CURR=0
          fi
          # An expired/invalid CI token 401s every query, which otherwise reads
          # as "recall collapsed to 0". Surface it as a token-rotation ask, not
          # a quality regression. Single event type — just annotate the reason.
          EXTRA=()
          if [ "$AUTH" = "True" ]; then
            EXTRA=(--data "reason=SEDIMENT_CI_TOKEN expired/invalid - rotate secret (NOT a quality regression)")
          fi
          python scripts/notify/notify.py send recall.regression \
            --routes services/sediment/config/notify_routes.yaml \
            --tenant hypeproof-lab \
            --data "prev_pass=$PREV" \
            --data "current_pass=$CURR" \
            --data "threshold=$PREV" \
            --data "url=$RUN_URL" \
            "${EXTRA[@]}"
