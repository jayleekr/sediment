name: sediment-cli release

# Builds the Rust CLI on tag push (vX.Y.Z) for three targets, archives the
# binaries, computes sha256s, and uploads everything to a GitHub Release.
# The Homebrew tap formula consumes these release assets.

on:
  push:
    tags:
      - "sediment-cli-v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/sediment-cli

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: sediment-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: sediment-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact: sediment-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sediment dist/sediment
          chmod +x dist/sediment
          cd dist && tar -czf "${{ matrix.artifact }}" sediment

      - name: SHA256
        run: |
          cd services/sediment-cli/dist
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
        working-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            services/sediment-cli/dist/${{ matrix.artifact }}
            services/sediment-cli/dist/${{ matrix.artifact }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
