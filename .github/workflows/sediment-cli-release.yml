name: sediment-cli release

# Builds the Rust CLI on tag push (vX.Y.Z) for three targets, archives the
# binaries, computes sha256s, and uploads everything to a GitHub Release.
# The Homebrew tap formula consumes these release assets.

on:
  push:
    tags:
      - "sediment-cli-v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/sediment-cli

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # sediment#19: macos-13 (Intel) runners are starved on GitHub-hosted —
          # queue waits of 30+ min are routine. We default to Apple Silicon
          # (covers nearly all team members) and Linux. Intel-mac users use
          # `cargo install --path .` or Rosetta-launched darwin-arm64.
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: sediment-aarch64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact: sediment-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sediment dist/sediment
          chmod +x dist/sediment
          cd dist && tar -czf "${{ matrix.artifact }}" sediment

      - name: SHA256
        run: |
          cd services/sediment-cli/dist
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
        working-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            services/sediment-cli/dist/${{ matrix.artifact }}
            services/sediment-cli/dist/${{ matrix.artifact }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release (private repo)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Mirror to public release repo so end users can `brew install` /
      # `curl install.sh` without a GitHub token. Source for binaries stays
      # private; only the artifacts move to the public mirror. See
      # sediment#33 for the install-friction issue this resolves.
      #
      # Required repo secret: RELEASE_MIRROR_TOKEN — fine-grained PAT with
      # `contents: write` on jayleekr/sediment-cli-releases ONLY. Falls back
      # to a warning (not a failure) if missing so private releases aren't
      # blocked while the secret is being provisioned.
      - name: Mirror to public release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASE_MIRROR_TOKEN secret not set — public mirror skipped (see sediment#33)"
            exit 0
          fi
          MIRROR_REPO=jayleekr/sediment-cli-releases
          # Idempotent: if the tag already exists on the mirror (re-run),
          # delete + recreate so the asset set is consistent.
          if gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$MIRROR_REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$MIRROR_REPO" \
            --title "Sediment CLI $TAG" \
            --notes "Mirrored from the private source repo. See [install instructions](https://github.com/$MIRROR_REPO#install)." \
            dist/*
          echo "::notice::Mirrored $TAG to $MIRROR_REPO. Install: brew install jayleekr/sediment/sediment"
