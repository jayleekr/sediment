name: cli-e2e

# Spawns the full platform locally + runs Rust E2E + Python shim E2E.
# Heavy enough to gate post-deploy rather than per-PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: curator
          POSTGRES_PASSWORD: curator_local_dev
          POSTGRES_DB: curator
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U curator -d curator"
          --health-interval 5s
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cd services/sediment-cli && cargo build

      - name: Install Python deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cd services/sediment
          ~/.local/bin/uv venv --python 3.11
          ~/.local/bin/uv pip install -e ".[dev]"

      - name: Schema + migrations + seed
        run: |
          cd services/sediment
          PGPASSWORD=curator_local_dev psql -h localhost -p 5433 -U curator -d curator -f ../../infra/init.sql
          PYTHONPATH=. .venv/bin/python -m scripts.apply_migrations
          PYTHONPATH=. .venv/bin/python -m scripts.seed_local || true

      - name: Start platform
        run: |
          cd services/sediment
          SEDIMENT_DEV_MODE=1 PYTHONPATH=. nohup .venv/bin/uvicorn applications.sediment_platform.main:app --port 10101 > /tmp/platform.log 2>&1 &
          # Wait for health
          for i in $(seq 1 30); do
            curl -sf http://localhost:10101/healthz && break
            sleep 1
          done

      - name: Rust E2E
        run: |
          cd services/sediment-cli
          SEDIMENT_E2E_BASE_URL=http://localhost:10101 \
          SEDIMENT_E2E_EMAIL=jay.lee@sonatus.com \
            cargo test --test e2e_login --test e2e_full -- --nocapture

      - name: Mint token for shim E2E
        id: mint
        run: |
          TOK=$(curl -s -X POST http://localhost:10101/api/v1/auth/dev-token \
            -H 'Content-Type: application/json' \
            -d '{"email":"jay.lee@sonatus.com"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          echo "token=$TOK" >> $GITHUB_OUTPUT

      - name: MCP shim E2E
        env:
          SEDIMENT_E2E_BASE_URL: http://localhost:10101
          SEDIMENT_E2E_TOKEN: ${{ steps.mint.outputs.token }}
          SEDIMENT_E2E_CLI: ${{ github.workspace }}/services/sediment-cli/target/debug/sediment
        run: |
          cd services/sediment-mcp
          PYTHONPATH=src ../sediment/.venv/bin/pytest tests/test_shim_e2e.py tests/test_shim_e2e_full.py -v

      - name: Upload platform log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-log
          path: /tmp/platform.log
