name: Curator — repo ingest

on:
  push:
    branches: [main]
    paths:
      - 'research/daily/**'
      - 'web/src/content/columns/**'
      - 'web/src/content/research/**'
      - 'web/src/content/novels/**'
      - 'products/**/*.md'
  workflow_dispatch:

jobs:
  ingest:
    if: ${{ vars.CURATOR_INGEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed files
        id: diff
        run: |
          git diff --name-only HEAD~1 HEAD -- \
            'research/daily/**.md' \
            'web/src/content/columns/**.md' \
            'web/src/content/research/**.md' \
            'web/src/content/novels/**.md' \
            'products/**/*.md' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> $GITHUB_OUTPUT

      - name: Ingest changed files via Curator API
        if: ${{ steps.diff.outputs.count != '0' }}
        env:
          CURATOR_API: ${{ secrets.CURATOR_API_URL }}
          CURATOR_TOKEN: ${{ secrets.CURATOR_INGEST_TOKEN }}
          CURATOR_TENANT: ${{ vars.CURATOR_TENANT_ID }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "ingest: $file"
            type="note"
            case "$file" in
              research/daily/*) type="research" ;;
              web/src/content/columns/*) type="column" ;;
              web/src/content/research/*) type="research" ;;
              web/src/content/novels/*) type="novel" ;;
            esac
            body=$(cat "$file")
            curl -fsS -X POST "$CURATOR_API/api/v1/ingest/document" \
              -H "Authorization: Bearer $CURATOR_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg ref "$file" --arg type "$type" --arg body "$body" \
                   '{ref:$ref, type:$type, body:$body}')" \
              || echo "ingest fail: $file"
          done < changed.txt
