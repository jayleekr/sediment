# Harness gates — fast canaries on every PR + push.
#
# Runs the same checks `make doctor` runs locally, minus the docker/uvicorn
# steps (which need infrastructure CI doesn't have). What this catches:
#
#   - :NAME::TYPE SQL cast regression (LEARNINGS hot-list)
#   - JWT roundtrip / 4-tier policy / search_utils drift
#   - chunker section-overlap or KO multibyte regression
#   - settings boot-guard regression (jwt_secret default, etc.)
#   - GitHub connector PAT mandate regression
#   - Discord circuit breaker primitives
#   - credentialed CORS regression (sediment#80): no broad/shared-apex origin
#     pattern may be paired with allow_credentials=True
#
# Runs fast (<60s typical). Required to pass before merge.

name: Harness gates

on:
  pull_request:
  push:
    branches: [main]
    paths:
      # Bash glob — files that, if changed, MIGHT regress the harness or
      # safety-critical code paths the smoke tests guard.
      - 'services/sediment/lab_lib/**'
      - 'services/sediment/applications/sediment_platform/routers/**'
      - 'services/sediment/applications/sediment_langgraph/**'
      - 'services/sediment/lab_platform/**'
      - 'services/sediment/validator/recipes.yaml'
      - 'services/sediment/validator/fixer.py'
      - 'services/sediment/validator/rubric.yaml'
      - 'harness/scripts/**'
      - 'services/sediment/pyproject.toml'
      # The CORS guard itself — a push that only edits the test must still run it.
      - 'services/sediment/tests/test_cors.py'
      - '.github/workflows/harness-gates.yml'

defaults:
  run:
    working-directory: .

jobs:
  lint-sql-cast:
    name: Lint :NAME::TYPE SQL cast
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: bash harness/scripts/lint-sql-cast.sh

  check-secrets:
    name: Scan PR diff for secrets / credentials / private keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history to diff against the base branch.
          fetch-depth: 0
      - name: Pick base ref
        id: base
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            echo "ref=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          else
            # Push event — diff against the previous commit. For force-pushes
            # this is intentionally narrow; the pre-push hook catches the rest.
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan diff for secrets
        run: bash harness/scripts/check-secrets.sh --diff "${{ steps.base.outputs.ref }}"

  smoke-tests:
    name: Python smoke tests (JWT, fixer 4-tier, search_utils, chunker, ...)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps (editable + dev extras)
        working-directory: services/sediment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # Install the package with dev extras (matches what `make install`
          # would do locally). Smoke tests need: jose, fastapi, fastmcp,
          # stripe, tiktoken, sqlalchemy, etc.
          .venv/bin/pip install -e ".[dev]"
      - name: Run smoke tests
        run: bash harness/scripts/smoke-tests.sh

      - name: CORS credentialed-origin guard (sediment#80)
        # tests/test_cors.py is the only regression guard for sediment#80:
        # allow_credentials=True must never be paired with a wildcard or with
        # any origin pattern over a shared apex (*.vercel.app), and
        # build_cors_kwargs must never emit allow_origin_regex at all.
        #
        # It lives here, not in cli-tests' "Backend + shim + rate-limit UT",
        # because it needs no database: it builds a throwaway Starlette app and
        # fires real preflights (~1s). That job boots Postgres, applies
        # init.sql, runs migrations and seeds before its first assertion — the
        # wrong place for a canary that must stay fast. SKIP_DB=1 matches how
        # the file is meant to be run (see its module docstring).
        working-directory: services/sediment
        env:
          SKIP_DB: "1"
        run: .venv/bin/python -m pytest tests/test_cors.py -v

  deploy-check-offline:
    name: Pre-push readiness (offline — fly auth not required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo (for cargo check step)
        run: rustup component add clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps
        working-directory: services/sediment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Run deploy-check (offline)
        # Skip validate-p0 in CI (no docker postgres). The full deploy-check
        # runs locally via `make deploy-check` before push.
        env:
          DEPLOY_CHECK_SKIP_VALIDATE: "1"
        run: bash harness/scripts/deploy-check.sh --skip-fly || true
        # Exit 0 always — this is informational in CI. The local
        # `make deploy-check` (with flyctl auth) is the real gate.
