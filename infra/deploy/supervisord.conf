; Supervisord manages 4 FastAPI services + nginx in the deploy container.
; All uvicorn processes bind to 127.0.0.1 — only nginx (8080) is exposed.

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:platform]
command=/usr/local/bin/uvicorn applications.sediment_platform.main:app
    --host 127.0.0.1 --port %(ENV_SEDIMENT_PLATFORM_PORT)s --workers 2
directory=/app/services/sediment
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:langgraph]
command=/usr/local/bin/uvicorn applications.sediment_langgraph.main:app
    --host 127.0.0.1 --port %(ENV_SEDIMENT_LANGGRAPH_PORT)s --workers 2
directory=/app/services/sediment
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:ingester]
command=/usr/local/bin/uvicorn applications.vault_ingester.main:app
    --host 127.0.0.1 --port %(ENV_VAULT_INGESTER_PORT)s --workers 1
directory=/app/services/sediment
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:metadata]
command=/usr/local/bin/uvicorn applications.metadata_svc.main:app
    --host 127.0.0.1 --port %(ENV_METADATA_SVC_PORT)s --workers 1
directory=/app/services/sediment
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
; nginx must wait for upstream uvicorns — 5s grace is enough on Fly cold start.
command=/bin/sh -c "sleep 5 && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:scheduler]
; Collection Agent scheduler — runs Discord fetch + distill + health/cost
; jobs on the cron expressions defined in config/cron.yaml. Same machine,
; same secrets, same DB connection pool as the API uvicorns (no extra VM cost).
;
; Boots AFTER nginx (priority=30) so the API has stabilized first; jobs
; themselves call DB directly (don't need nginx).
command=/bin/sh -c "sleep 15 && /run-with-db.sh python -m scripts.scheduler"
directory=/app/services/sediment
autostart=true
autorestart=true
startretries=10
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:discord_gateway]
; Interactive arm of the Collection Agent — long-running Discord Gateway
; WebSocket listener that responds to @bot mentions in real-time. Talks
; to the langgraph uvicorn (port 10020) on localhost for the chat stream,
; and uses the bot REST API for thread replies.
;
; Requires:
;   - DISCORD_BOT_TOKEN secret (already set)
;   - MESSAGE_CONTENT privileged intent enabled in Discord developer portal
;     (Bot tab → Privileged Gateway Intents → Message Content) — Jay action.
;
; Self-healing — DiscordGateway.stream() has internal reconnect with
; exponential backoff. supervisord restart is just for hard crashes.
;
; Boots AFTER langgraph + nginx so chat stream is reachable.
command=/bin/sh -c "sleep 20 && /run-with-db.sh python -m scripts.discord_gateway_runner"
directory=/app/services/sediment
autostart=true
autorestart=true
startretries=10
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
