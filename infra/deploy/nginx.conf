# Internal router: all public traffic enters on :8080, fans out to the
# uvicorn processes on 127.0.0.1.
#
# SSE (langgraph) requires:
#   - proxy_buffering off — otherwise nginx waits for full response before flush
#   - proxy_read_timeout long — streams can run minutes
#   - HTTP/1.1 upstream

events { worker_connections 1024; }

http {
    # Default mime types — needed for /docs (Swagger UI assets).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # WO-7 2026-05-23: hide the nginx version banner. Default `nginx/1.24.0`
    # gives attackers a head-start on CVE matching.
    server_tokens off;

    # DNS resolver for the /proxy/anthropic upstream (nginx resolves https://
    # proxy_pass targets via this when not in an upstream{} block).
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

    # Upstreams pulled from env at start (envsubst in start.sh would be cleaner,
    # but Fly env is stable so hardcode the standard ports).
    upstream platform   { server 127.0.0.1:10100; }
    upstream langgraph  { server 127.0.0.1:10020; }
    upstream ingester   { server 127.0.0.1:11000; }

    server {
        listen 8080;
        server_name _;

        # WO-7 2026-05-23: baseline security headers on every response.
        # `always` makes them apply to error pages too (4xx/5xx default to
        # omitting add_header). Each header rationale:
        #   - HSTS: 1y, includeSubDomains. Locks browsers to HTTPS for the
        #     custom domain (sediment.hypeproof-ai.xyz). Safe — Fly serves
        #     HTTPS only at the edge.
        #   - X-Frame-Options: DENY. We have no UI surface served from Fly
        #     (everything's on Vercel), so clickjacking is N/A; deny is the
        #     conservative default for any future routes.
        #   - X-Content-Type-Options: nosniff. Belt-and-suspenders MIME
        #     stickiness — pairs with mime.types above.
        #   - Referrer-Policy: strict-origin-when-cross-origin. Default
        #     behavior most apps want; reveals origin only on same-origin.
        #   - Permissions-Policy: lock down browser features we never use
        #     from the API surface (camera, microphone, geo, etc.).
        # CSP intentionally left to the Next.js frontend layer — putting it
        # here would block the legit /docs Swagger UI inline scripts.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Health: answered by nginx itself, NOT proxied to platform. Proxying
        # meant a busy/streaming platform worker starved /healthz → Fly marked
        # the machine unhealthy mid-request and cycled it, killing live SSE.
        # nginx-local 200 means "the container's web tier is up"; deep health
        # (DB/auth) is covered by the rubric + app-level checks, not the LB ping.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # REST + auth + library + members + admin + billing — all platform.
        location /api/v1/ {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE streaming — disable buffering, long read timeout.
        location /v1/sediment/ {
            proxy_pass http://langgraph;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # GitHub webhook → vault ingester. Body up to 2MB for large diffs.
        location /webhook/ {
            proxy_pass http://ingester;
            client_max_body_size 2m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs (platform only — others are internal).
        # WO-7 2026-05-23: gated by a separate env var. Default (empty) →
        # /docs and /openapi.json return 404 in prod. Set ALLOW_PUBLIC_DOCS=1
        # in Fly secrets to expose them temporarily for an audit.
        #
        # 2026-05-24 fix: route the env through a `set` directive first.
        # `if ("${X}" != "1")` with an empty X expanded by envsubst became
        # `if ("" != "1")` which nginx rejects as "invalid condition """""
        # at parse time → master refused to start. The `set` pattern accepts
        # an empty string and only the `if` comparison runs against the
        # bound variable.
        location /docs {
            set $allow_public_docs "${ALLOW_PUBLIC_DOCS}";
            if ($allow_public_docs != "1") { return 404; }
            proxy_pass http://platform/docs;
        }
        location /openapi.json {
            set $allow_public_docs "${ALLOW_PUBLIC_DOCS}";
            if ($allow_public_docs != "1") { return 404; }
            proxy_pass http://platform/openapi.json;
        }

        # Anthropic API egress proxy for sibling HypeProof products (e.g.
        # hypeproof-studio Worker). Why this exists: Cloudflare Workers'
        # anycast lands some calls on the HKG PoP, and Anthropic refuses
        # Hong Kong-originated traffic per their geo policy → 403. This
        # Fly instance is pinned to NRT (Tokyo), which Anthropic accepts.
        #
        # 2026-05-23 FIX-B (REPORT.md CRIT #3): previously this was an
        # unauthenticated open relay. Anyone on the internet could supply
        # their own x-api-key and burn our NRT bandwidth / get our IP
        # flagged by Anthropic abuse / bypass their HKG geofence at our
        # cost. Now: the caller must present ANTHROPIC_PROXY_SECRET in the
        # X-Sediment-Proxy-Secret header. Studio Worker stores it as a
        # Cloudflare Worker secret; without this header → 403.
        location /proxy/anthropic/ {
            # Shared-secret check. The ${ANTHROPIC_PROXY_SECRET} placeholder
            # is substituted at container boot by start.sh (envsubst). nginx
            # itself doesn't read env at runtime; this is the standard
            # zero-dep pattern. start.sh also asserts the env is non-empty
            # before substitution, so a successful boot guarantees a non-
            # trivial secret is wired in.
            #
            # 2026-05-24: use `set` indirection so an empty secret (shouldn't
            # happen — start.sh asserts — but defense in depth) doesn't
            # crash nginx with "invalid condition """"" at parse time.
            set $expected_proxy_secret "${ANTHROPIC_PROXY_SECRET}";
            if ($http_x_sediment_proxy_secret != $expected_proxy_secret) {
                return 403 "proxy: missing or invalid X-Sediment-Proxy-Secret header";
            }
            rewrite ^/proxy/anthropic/(.*)$ /$1 break;
            proxy_pass https://api.anthropic.com;
            proxy_ssl_server_name on;
            proxy_ssl_name api.anthropic.com;
            proxy_set_header Host api.anthropic.com;
            # Don't forward the shared secret upstream (Anthropic shouldn't
            # see it, only our edge proxy).
            proxy_set_header X-Sediment-Proxy-Secret "";
            # Don't leak our internal forwarding headers upstream.
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            # SSE streaming + long-lived
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Browser-friendly redirect to the UI. Fly is API-only, but raw 404 on
        # https://hypeproof-sediment.fly.dev/ (or /sediment, etc.) has caused
        # repeated "is it broken?" confusion (NEXT.md P4). The four real API
        # locations above match first; anything else here = browser hit, 302
        # to the standalone Vercel UI.
        location / { return 302 https://sediment.hypeproof-ai.xyz$request_uri; }
    }
}
