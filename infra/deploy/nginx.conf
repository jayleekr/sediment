# Internal router: all public traffic enters on :8080, fans out to the
# uvicorn processes on 127.0.0.1.
#
# SSE (langgraph) requires:
#   - proxy_buffering off — otherwise nginx waits for full response before flush
#   - proxy_read_timeout long — streams can run minutes
#   - HTTP/1.1 upstream

events { worker_connections 1024; }

http {
    # Default mime types — needed for /docs (Swagger UI assets).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # DNS resolver for the /proxy/anthropic upstream (nginx resolves https://
    # proxy_pass targets via this when not in an upstream{} block).
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

    # Upstreams pulled from env at start (envsubst in start.sh would be cleaner,
    # but Fly env is stable so hardcode the standard ports).
    upstream platform   { server 127.0.0.1:10100; }
    upstream langgraph  { server 127.0.0.1:10020; }
    upstream ingester   { server 127.0.0.1:11000; }

    server {
        listen 8080;
        server_name _;

        # Health: answered by nginx itself, NOT proxied to platform. Proxying
        # meant a busy/streaming platform worker starved /healthz → Fly marked
        # the machine unhealthy mid-request and cycled it, killing live SSE.
        # nginx-local 200 means "the container's web tier is up"; deep health
        # (DB/auth) is covered by the rubric + app-level checks, not the LB ping.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # REST + auth + library + members + admin + billing — all platform.
        location /api/v1/ {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE streaming — disable buffering, long read timeout.
        location /v1/sediment/ {
            proxy_pass http://langgraph;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # GitHub webhook → vault ingester. Body up to 2MB for large diffs.
        location /webhook/ {
            proxy_pass http://ingester;
            client_max_body_size 2m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs (platform only — others are internal)
        location /docs   { proxy_pass http://platform/docs;   }
        location /openapi.json { proxy_pass http://platform/openapi.json; }

        # Anthropic API egress proxy for sibling HypeProof products (e.g.
        # hypeproof-studio Worker). Why this exists: Cloudflare Workers'
        # anycast lands some calls on the HKG PoP, and Anthropic refuses
        # Hong Kong-originated traffic per their geo policy → 403. This
        # Fly instance is pinned to NRT (Tokyo), which Anthropic accepts.
        # Open relay by design: the client supplies its own `x-api-key`
        # (Studio Worker has its own ANTHROPIC_API_KEY secret); we just
        # provide a Tokyo egress. Cost to us = bandwidth only.
        # Follow-up: add a shared-secret header check before scale-out.
        location /proxy/anthropic/ {
            rewrite ^/proxy/anthropic/(.*)$ /$1 break;
            proxy_pass https://api.anthropic.com;
            proxy_ssl_server_name on;
            proxy_ssl_name api.anthropic.com;
            proxy_set_header Host api.anthropic.com;
            # Don't leak our internal forwarding headers upstream.
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            # SSE streaming + long-lived
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_http_version 1.1;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Browser-friendly redirect to the UI. Fly is API-only, but raw 404 on
        # https://hypeproof-sediment.fly.dev/ (or /sediment, etc.) has caused
        # repeated "is it broken?" confusion (NEXT.md P4). The four real API
        # locations above match first; anything else here = browser hit, 302
        # to the standalone Vercel UI.
        location / { return 302 https://sediment.hypeproof-ai.xyz$request_uri; }
    }
}
